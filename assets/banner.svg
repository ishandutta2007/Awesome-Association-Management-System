<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.4; }
      50% { transform: scale(1.15) translate(-15px, 20px); opacity: 0.7; }
    }
    @keyframes floatWave {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes shine {
      0% { stroke-dashoffset: 600; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -600; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 260px; }
    .wave-group { animation: floatWave 6s ease-in-out infinite; }
    .animated-border {
      stroke-dasharray: 200 400;
      animation: shine 12s linear infinite;
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #a7f3d0;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #9ca3af;
    }
  </style>

  <!-- Base Card Container -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2" />

  <!-- Dynamic Background Glowing Orbs -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="200" cy="90" r="160" fill="url(#accent-grad-1)" opacity="0.35" />
    <circle class="orb-2" cx="1020" cy="270" r="190" fill="url(#accent-grad-2)" opacity="0.35" />
  </g>

  <!-- Abstract Grid Network & Waves -->
  <g class="wave-group" opacity="0.25">
    <path d="M-50,220 C300,140 600,320 1250,180" fill="none" stroke="#8b5cf6" stroke-width="2" />
    <path d="M-50,250 C350,170 650,350 1250,210" fill="none" stroke="#3b82f6" stroke-width="1.5" />
    <path d="M-50,280 C400,200 700,380 1250,240" fill="none" stroke="#ec4899" stroke-width="1" />
  </g>

  <!-- Decorative Outer Shimmer Border -->
  <rect class="animated-border" x="4" y="4" width="1192" height="352" rx="12" fill="none" stroke="url(#accent-grad-1)" stroke-width="2" opacity="0.6" />

  <!-- Foreground Content Container -->
  <g transform="translate(80, 75)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5" />
      <circle cx="16" cy="16" r="5" fill="#34d399" />
      <text x="32" y="21" class="badge-text">Association Management</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" class="title-text">
      Awesome Association Management System
    </text>

    <!-- Subtitle Line 1 & Line 2 -->
    <text x="0" y="140" class="subtitle-text">
      A curated index of top-tier SaaS platforms &amp; open-source projects for associations,
    </text>
    <text x="0" y="170" class="subtitle-text">
      chambers of commerce, non-profits, membership databases, and community networks.
    </text>
  </g>
</svg>
